# ---------------------------------------------------------------------
# General (https://omarchy.org/manual/navigation)
# ---------------------------------------------------------------------
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"          # truecolor
set  -g mouse on
set  -g base-index 1                         # start from 1, not 0
setw -g pane-base-index 1
set  -g renumber-windows on                  # re-number when closing windows
set  -g history-limit 50000
set -sg escape-time 10                       # do not eat Esc in nvim
set  -g focus-events on
set  -g set-clipboard on
set  -g allow-passthrough on                 # image protocols
setw -g aggressive-resize on
set  -g detach-on-destroy off                # prefix K hops to another session
set  -g set-titles on
set  -g set-titles-string "#h:#W"

# Shift+Enter is indistinguishable from Enter over plain xterm encoding, so
# M-S-Enter below would never fire. Needs the terminal to speak CSI-u too,
# which Ghostty does by default.
set  -g extended-keys on
set  -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"

# Prefix
set -g prefix C-b
set -g prefix2 None
unbind C-Space
bind -N "Send prefix" C-b send-prefix

# ---------------------------------------------------------------------
# Omarchy terminal layer (https://omarchy.org/manual/hotkeys)
# ---------------------------------------------------------------------

# Config and help
bind -N "Reload configuration" q source-file ~/.tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Keep these personal shortcuts uppercase so they do not conflict with Omarchy.
# open a note for billion $ idea
bind -r E split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# a quick todo list for today
bind -r O split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# open a vim window on the right
bind -r V split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# plugins
set -g @plugin 'tmux-plugins/tpm'
# save tmux session even tmux-server is killed
# leader + ctrl + s for saving
# leader + ctrl + r for reload
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'

# status bar 
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

set -g window-status-separator ""  # Removes the space between windows
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text "#[bg=#{@thm_mantle}] #{b:pane_current_path}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text "#W" # show path for active panes, fallback to app name
set -g @catppuccin_window_number_color "#{@thm_lavender}"

set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]#S "

set -g status-style fg=default,bg=default 
set -g status-interval 15
set -g status-right-length 80 #character length

bind-key b command-prompt -p "Pomodoro (sessions [work break])" "run-shell '~/dotfiles/modules/tmux/bin/pomocmd.sh %%'"

bind-key 0 run-shell '~/dotfiles/modules/tmux/bin/pomodoro.sh stop'

set -g status-right "#(bash ~/dotfiles/modules/tmux/bin/pomodoro.sh) #(bash ~/dotfiles/modules/tmux/bin/random_note.sh) "
set -agF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰘛 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(memory_pressure | awk '{print 100 - $5}')"\%%" "
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰢗 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %m/%d:%H"
# set -agF status-right "#[fg=#{@thm_green}]"

# This line need to be in bottom of the file
run '~/.tmux/plugins/tpm/tpm'

set -g status-bg default
set -g status-style bg=default
