# cmd-ctrl-k -- see docs/keybindings.md#herdr.
# A config file rather than `ghostty -e`, the same reason localsend-share.conf
# is one: `-e` makes Ghostty ask "Allow Ghostty to execute ...?" every time an
# app launches it that way, with no option to remember the answer. The window
# is an ordinary one, so no size is set here.
# Inherits the main config (the CLI --config-file layers on top of it); do not
# `config-file` it explicitly, or its `title = ""` would win.
command = /Users/ducannh/dotfiles/modules/aerospace/bin/herdr-keys.sh
title = Herdr-Keys
window-save-state = never
quit-after-last-window-closed = true
