# cmd-ctrl-u.
# A config file rather than `ghostty -e`: AppKit turns every existing path after
# -e into an open-file event, and Ghostty answers each with "Allow Ghostty to
# execute ...?". btop gets away with -e because its command is one path; this
# one carries three.
command = direct:/opt/homebrew/bin/dua i / -i /System/Volumes/Data
window-save-state = never
quit-after-last-window-closed = true
