id = "dotfiles.agent-numbers"
name = "Sidebar numbers"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Show indexed shortcuts in the Agent and Space panels"
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "workspace.created"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "workspace.moved"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "tab.closed"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "tab.moved"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "pane.closed"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "pane.moved"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "pane.exited"
command = ["python3", "sidebar_numbers.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "sidebar_numbers.py"]
