[ui]
accent = "blue"

pane_gaps = false
pane_outer_borders = false

pane_scrollbars = false

confirm_close = false

prompt_new_tab_name = false

mouse_capture = true

tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

window_title = "{hostname}: {workspace}"

show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
# Filled by the local plugin in modules/herdr/agent-numbers.
rows = [
  ["state_icon", "$shortcut", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "$shortcut", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "system"
