set -g default-terminal "screen-256color"

# Prefix. Omarchy offers "Ctrl+Space or Ctrl+B"; C-a is kept here because
# C-Space is nvim's cmp completion trigger (lua/plugins/completions.lua).
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g mouse on

# ---------------------------------------------------------------------
# Omarchy terminal layer (https://omarchy.org/manual/hotkeys)
# ---------------------------------------------------------------------

# -- panes -------------------------------------------------------------
unbind %
unbind '"'
unbind r
unbind m

bind v split-window -h -c '#{pane_current_path}'   # split vertical (side by side)
bind h split-window -v -c '#{pane_current_path}'   # split horizontal (stacked)
bind x kill-pane
bind z resize-pane -Z

# kept from the previous config as extra split aliases
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# no prefix
bind -n M-Enter   split-window -v -c '#{pane_current_path}'
bind -n M-S-Enter split-window -h -c '#{pane_current_path}'
bind -n M-Escape  kill-pane

bind -n C-M-Left  select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up    select-pane -U
bind -n C-M-Down  select-pane -D

bind -n C-M-S-Left  resize-pane -L 5
bind -n C-M-S-Right resize-pane -R 5
bind -n C-M-S-Up    resize-pane -U 5
bind -n C-M-S-Down  resize-pane -D 5

# -- windows -----------------------------------------------------------
bind k kill-window
bind r command-prompt -I '#W' 'rename-window "%%"'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left  previous-window
bind -n M-Right next-window

bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# -- sessions ----------------------------------------------------------
bind C new-session
bind K kill-session
bind R command-prompt -I '#S' 'rename-session "%%"'
bind N switch-client -n
bind P switch-client -p

bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# -- misc --------------------------------------------------------------
# reload moves to q because Omarchy puts rename-window on r
bind q source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# new window
bind c new-window -c '#{pane_current_path}'

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# Moved to uppercase: e/o/v now belong to the Omarchy pane bindings above.
# open a note for billion $ idea
bind -r E split-window -h "nvim ~/Documents/git/scratch/notes_$(date +'%y%m%d%H').md"
# a quick todo list for today
bind -r O split-window -h "nvim ~/Documents/git/scratch/todo_$(date +'%y%m%d').md"
# open a vim window on the right
bind -r V split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# save tmux session even tmux-server is killed
# leader + ctrl + s for saving
# leader + ctrl + r for reload
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'

# status bar 
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

set -g window-status-separator ""  # Removes the space between windows
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text "#[bg=#{@thm_mantle}] #{b:pane_current_path}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text "#W" # show path for active panes, fallback to app name
set -g @catppuccin_window_number_color "#{@thm_lavender}"

set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]#S "

set -g status-style fg=default,bg=default 
set -g status-interval 15
set -g status-right-length 80 #character length

bind-key b command-prompt -p "Pomodoro (sessions [work break])" "run-shell '~/dotfiles/tmux/pomocmd.sh %%'"

bind-key 0 run-shell '~/dotfiles/tmux/pomodoro.sh stop'

set -g status-right "#(bash ~/dotfiles/tmux/pomodoro.sh) #(bash ~/dotfiles/tmux/random_note.sh) "
set -agF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰘛 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(memory_pressure | awk '{print 100 - $5}')"\%%" "
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰢗 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %m/%d:%H"
# set -agF status-right "#[fg=#{@thm_green}]"

# image
set -g allow-passthrough on

# This line need to be in bottom of the file
run '~/.tmux/plugins/tpm/tpm'

set -g status-bg default
set -g status-style bg=default
